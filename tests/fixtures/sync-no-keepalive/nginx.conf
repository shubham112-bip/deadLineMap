events {}
http {
    upstream app_server {
        server 127.0.0.1:8000;
        keepalive 16;
        keepalive_timeout 60s;
    }
    server {
        location / {
            proxy_pass http://app_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
