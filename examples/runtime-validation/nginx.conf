events {
    worker_connections 64;
}

http {
    upstream deadline_backend {
        server app:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://deadline_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 10s;
        }
    }
}
