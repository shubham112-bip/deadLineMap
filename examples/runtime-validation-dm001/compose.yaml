services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: deadlinemap-runtime-dm001-app:local
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=1)"
      interval: 2s
      timeout: 2s
      retries: 15

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEADLINEMAP_DM001_PORT:-18082}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
