name: tests

on:
  push:
    branches:
      - "mvp/**"
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Smoke-test CLI
        run: |
          deadlinemap --version
          deadlinemap scan tests/fixtures/keepalive-mismatch
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Test the built wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-test/bin/deadlinemap" --version
          "$RUNNER_TEMP/wheel-test/bin/deadlinemap" tests/fixtures/keepalive-mismatch
